name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  # Allows release.yml to reuse these jobs as a quality gate before building.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # "build" runs `tsc && vite build`, so this covers type checking too.
      - name: Typecheck and build
        run: bun run build

      # When frontend tests exist, add a test runner step here, e.g.:
      # - run: bun test

  rust-test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri::generate_context! requires frontendDist (../dist) to exist at
      # compile time, so the frontend must be built before cargo test.
      - name: Build frontend
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Run tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
