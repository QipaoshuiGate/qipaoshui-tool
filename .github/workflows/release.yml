name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Reuse the CI jobs (frontend build + Rust tests) as a gate: no release
  # build starts unless tests pass.
  test:
    uses: ./.github/workflows/ci.yml

  # Create the draft release once, up front. If every matrix job creates it
  # by tag instead, parallel jobs race and produce duplicate drafts with the
  # assets split between them (draft releases are not unique per tag).
  create-release:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - name: Create or reuse draft release
        id: create
        uses: actions/github-script@v8
        with:
          script: |
            const tag = process.env.GITHUB_REF_NAME
            // Reuse an existing draft for this tag so workflow re-runs stay idempotent.
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            })
            const existing = releases.find((r) => r.draft && r.tag_name === tag)
            if (existing) return existing.id
            const body = [
              'Download the installer for your platform:',
              '- **macOS**: `.dmg` (`aarch64` for Apple Silicon, `x64` for Intel)',
              '- **Windows**: `.msi` or `-setup.exe`',
              '- **Linux**: `.deb`, `.rpm`, or `.AppImage`',
              '',
              '> **macOS first launch**: builds are not notarized by Apple yet, so',
              '> macOS will warn about an unverified developer. Approve the app',
              '> under System Settings → Privacy & Security → "Open Anyway", or run',
              '> `xattr -cr /Applications/qipaoshui-tool.app` in a terminal.',
            ].join('\n')
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `qipaoshui-tool ${tag}`,
              body,
              draft: true,
              prerelease: tag.includes('-'),
            })
            return data.id

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon (M1 and later)
            rust-target: aarch64-apple-darwin
            tauri-args: --target aarch64-apple-darwin
          - platform: macos-latest # Intel
            rust-target: x86_64-apple-darwin
            tauri-args: --target x86_64-apple-darwin
          # ubuntu-22.04 (not -latest) so binaries link an older glibc and run
          # on more distros. If GitHub retires this runner, bump to 24.04.
          - platform: ubuntu-22.04
            rust-target: ""
            tauri-args: ""
          - platform: windows-latest
            rust-target: ""
            tauri-args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Tauri system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}-${{ matrix.rust-target }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build app and create GitHub release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # To ship notarized macOS builds (no Gatekeeper warning at all),
          # get an Apple Developer ID certificate, add these repo secrets,
          # and uncomment. Until then, bundles are ad-hoc signed via
          # bundle.macOS.signingIdentity in tauri.conf.json.
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          # Upload into the draft created by the create-release job; name,
          # body, and draft/prerelease flags are set there.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.tauri-args }}

      # Tauri stamps the version into every bundle filename, so a link to a
      # specific installer breaks on the next release. Upload a second copy of
      # each installer under a version-less name as well, so download links can
      # point at /releases/latest/download/<name> and never need updating.
      # The version-stamped originals are left untouched.
      #
      # Uses the release id (not the tag) because the release is still a draft
      # at this point, and drafts are not resolvable by tag via the API.
      - name: Upload version-less installer aliases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # tauri-action doesn't emit a releaseId output when the release is
          # pre-created by the create-release job, so use that job's id.
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          set -euo pipefail

          # find, not a globstar glob: macOS runners still ship bash 3.2.
          while IFS= read -r path; do
            case "$(basename "$path")" in
              *_aarch64.dmg) alias=qipaoshui-tool-macos-aarch64.dmg ;;
              *_x64.dmg)     alias=qipaoshui-tool-macos-x64.dmg ;;
              *-setup.exe)   alias=qipaoshui-tool-windows-x64-setup.exe ;;
              *.msi)         alias=qipaoshui-tool-windows-x64.msi ;;
              *.deb)         alias=qipaoshui-tool-linux-amd64.deb ;;
              *.rpm)         alias=qipaoshui-tool-linux-x86_64.rpm ;;
              *.AppImage)    alias=qipaoshui-tool-linux-amd64.AppImage ;;
              *) continue ;;
            esac

            # Make re-runs idempotent: drop a same-named asset if one exists.
            old=$(gh api "repos/$REPO/releases/$RELEASE_ID/assets" \
              --jq ".[] | select(.name == \"$alias\") | .id")
            if [ -n "$old" ]; then
              gh api --method DELETE "repos/$REPO/releases/$RELEASE_ID/assets/$old" >/dev/null
            fi

            echo "uploading $alias  <-  $path"
            gh api --method POST \
              -H "Content-Type: application/octet-stream" \
              "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=$alias" \
              --input "$path" >/dev/null
          done < <(find src-tauri/target -type f -path '*/release/bundle/*')
